name: Mon Lifestyle — appli Mac

on:
  push:
    paths:
      - "lifestyle-dashboard/**"
      - ".github/workflows/lifestyle-mac.yml"
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: lifestyle-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Mon-Lifestyle-mac
          path: lifestyle-dashboard/dist/*.dmg
