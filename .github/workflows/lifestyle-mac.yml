name: Mon Lifestyle — appli Mac

on:
  push:
    paths:
      - "lifestyle-dashboard/**"
      - ".github/workflows/lifestyle-mac.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: lifestyle-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Mon-Lifestyle-mac
          path: lifestyle-dashboard/dist/*.dmg
      # Publie les .dmg dans une Release : liens de téléchargement directs
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: lifestyle-v${{ github.run_number }}
          name: Mon Lifestyle (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Mac M1/M2/M3/M4** → Mon-Lifestyle-arm64.dmg
            **Mac Intel** → Mon-Lifestyle-x64.dmg

            Après l'avoir glissée dans Applications, lance une fois dans le Terminal :
            `xattr -cr "/Applications/Mon Lifestyle.app"`
          files: lifestyle-dashboard/dist/*.dmg
