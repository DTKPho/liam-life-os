<!doctype html>
<html lang="fr" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lifestyle</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="trips.css">
</head>
<body>
<div id="bg"></div>
<div class="app">
  <aside>
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" class="i"><path d="M6 3h12l4 6-10 12L2 9z"/><path d="M2 9h20M10 3 8 9l4 12 4-12-2-6"/></svg></div>
      <div><b>Lifestyle</b><small>Inventaire privé</small></div>
    </div>
    <div class="nav-scroll">
      <div class="nav" id="navMain"></div>
      <div class="nav-label">Évasions</div>
      <div class="nav" id="navTrips"></div>
      <div class="nav-label">Collections <button data-action="new-cat" title="Nouvelle collection"><svg class="i" viewBox="0 0 24 24" style="width:15px;height:15px"><path d="M12 5v14M5 12h14"/></svg></button></div>
      <div class="nav" id="navCats"></div>
      <button class="nav-item add-cat" data-action="new-cat"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="name">Nouvelle collection</span></button>
    </div>
    <div class="side-foot">
      <button class="nav-item" data-action="settings"><svg class="i" viewBox="0 0 24 24"><circle cx="13.5" cy="6.5" r="1.5"/><circle cx="17.5" cy="10.5" r="1.5"/><circle cx="8.5" cy="7.5" r="1.5"/><circle cx="6.5" cy="12.5" r="1.5"/><path d="M12 2a10 10 0 0 0 0 20c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.4A5.6 5.6 0 0 0 22 9.8C22 5.5 17.5 2 12 2z"/></svg>Apparence</button>
      <button class="nav-item" data-action="export"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>Exporter une sauvegarde</button>
      <button class="nav-item" data-action="import"><svg class="i" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M4 20h16"/></svg>Importer</button>
      <button class="nav-item" data-action="open-data" id="btnOpenData" hidden><svg class="i" viewBox="0 0 24 24"><path d="M3 6a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg>Dossier des données</button>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div class="crumbs" id="crumbs"></div>
      <div class="spacer"></div>
      <label class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" placeholder="Rechercher…"></label>
      <button class="btn primary" data-action="add-item" id="topAdd"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Ajouter un bien</span></button>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<!-- Formulaire générique (biens, collections, voyages, réglages…) -->
<div class="overlay" id="formOverlay">
  <div class="modal" id="formModal">
    <div class="modal-head"><h2 id="formTitle"></h2><button class="x" data-action="close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="modal-body"><form class="form" id="form" autocomplete="off" onsubmit="return false"></form></div>
    <div class="modal-foot">
      <button class="btn danger" data-action="form-delete" id="formDelete">Supprimer</button>
      <div class="spacer"></div>
      <button class="btn ghost" data-action="close">Annuler</button>
      <button class="btn primary" data-action="form-save" id="formSave">Enregistrer</button>
    </div>
  </div>
</div>

<!-- Fiche bien -->
<div class="overlay" id="detailOverlay"><div class="modal wide" id="detailBody"></div></div>

<!-- Visionneuse -->
<div class="lightbox" id="lightbox">
  <img id="lbImg" alt="">
  <button class="lb-btn lb-prev" data-action="lb-step" data-step="-1"><svg class="i" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
  <button class="lb-btn lb-next" data-action="lb-step" data-step="1"><svg class="i" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
  <button class="lb-close" data-action="lb-close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <div class="lb-cap" id="lbCap"></div>
</div>

<input type="file" id="photoInput" accept="image/*" multiple hidden>
<input type="file" id="importInput" accept="application/json,.json" hidden>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
<script src="trips.js"></script>
</body>
</html>
