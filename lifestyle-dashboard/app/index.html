    const defCat = catId || (ui.view.startsWith("cat:") ? ui.view.slice(4) : state.categories[0].id);
    const defStatus = ui.view === "wish" || (ui.view.startsWith("cat:") && ui.tab === "wish") ? "wish" : "owned";
    const it = item || { cat: defCat, status: defStatus, photos: [], specs: {} };
    ["name","cat","status","brand","model","year","location","buyPrice","value","buyDate","notes"].forEach(k => f[k].value = it[k] ?? "");
    ui.draftPhotos = [...(it.photos || [])];
    renderSpecFields(it.specs || {});
    renderFormThumbs();
    $("#itemTitle").textContent = item ? "Modifier le bien" : "Ajouter un bien";
    $("#btnDeleteItem").style.visibility = item ? "visible" : "hidden";
    open("#itemOverlay");
    f.name.focus();
  }
  function renderSpecFields(specs) {
    const c = catById($("#itemCat").value);
    const fields = TYPES[c?.type]?.fields || [];
    $("#specsTitle").style.display = fields.length ? "" : "none";
    $("#specFields").innerHTML = fields.map(([k, label, full]) =>
      `<div class="field ${full ? "full" : ""}"><label>${esc(label)}</label><input data-spec="${k}" value="${esc(specs[k] || "")}"></div>`).join("");
  }
  function currentSpecs() {
    const o = {}; document.querySelectorAll("#specFields [data-spec]").forEach(i => { if (i.value.trim()) o[i.dataset.spec] = i.value.trim(); }); return o;
  }
  function renderFormThumbs() {
    $("#formThumbs").innerHTML = ui.draftPhotos.map((p, i) => `
      <div class="thumb"><img src="${esc(photoSrc(p))}" alt="">
        ${i === 0 ? `<span class="cover">Couverture</span>` : ""}
        <button type="button" class="rm" data-rm-draft="${i}" title="Retirer">${icon("x")}</button></div>`).join("")
      + `<button type="button" class="thumb add" data-action="pick-form-photos" title="Ajouter des photos">${icon("plus")}</button>`;
  }
  function saveItem() {
    const f = $("#itemForm");
    if (!f.name.value.trim()) { f.name.focus(); f.name.reportValidity(); return; }
    const data = {};
    ["name","cat","status","brand","model","year","location","buyPrice","value","buyDate","notes"].forEach(k => data[k] = f[k].value.trim());
    data.photos = ui.draftPhotos.slice();
    data.specs = currentSpecs();
    let it;
    if (ui.editItem) {
      it = itemById(ui.editItem);
      it.photos.filter(p => !data.photos.includes(p)).forEach(dropPhotoFile);
      Object.assign(it, data, { updatedAt: Date.now() });
    } else {
      it = { id: uid(), createdAt: Date.now(), ...data };
      state.items.push(it);
    }
    ui.newPhotos = [];
    const wasEdit = !!ui.editItem;
    save(); closeAll(); render();
    toast(wasEdit ? "Modifications enregistrées" : "Bien ajouté");
    if (wasEdit) openDetail(it.id);
  }
  function deleteItem(id) {
    const it = itemById(id); if (!it) return;
    if (!confirm(`Supprimer « ${it.name} » ? Ses photos seront aussi supprimées.`)) return;
    it.photos.forEach(dropPhotoFile);
    ui.newPhotos.forEach(dropPhotoFile); ui.newPhotos = [];
    state.items = state.items.filter(i => i.id !== id);
    save(); closeAll(); render(); toast("Bien supprimé");
  }

  function openDetail(id, idx = 0) {
    const it = itemById(id); if (!it) return;
    ui.detailId = id; ui.detailIdx = Math.min(idx, Math.max(0, it.photos.length - 1));
    const c = catById(it.cat);
    const bp = num(it.buyPrice), v = num(it.value);
    const specDefs = TYPES[c?.type]?.fields || [];
    const rows = [
      ["Statut", { owned: "Possédé", wish: "Wishlist", sold: "Vendu" }[it.status]],
      ["Marque", it.brand], ["Modèle", it.model], ["Année", it.year],
      ...specDefs.map(([k, l]) => [l, it.specs?.[k]]),
      ["Prix d'achat", bp ? eur(bp) : ""],
      ["Plus-value", bp && v && it.status === "owned" ? `${v - bp >= 0 ? "+" : ""}${eur(v - bp)}` : ""],
      ["Date d'achat", fmtDate(it.buyDate)],
      ["Emplacement", it.location],
    ].filter(r => r[1]);
    const p = it.photos;
    const cur = p[ui.detailIdx];
    $("#detailBody").innerHTML = `
      <div class="modal-head"><h2>${esc(c?.name || "")}</h2><button class="x" data-action="close">${icon("x")}</button></div>
      <div class="detail">
        <div class="gallery">
          <div class="stage" id="stage" data-drop-item="${esc(it.id)}">
            ${cur ? `<img src="${esc(photoSrc(cur))}" alt="">` : `<button class="placeholder" data-add-photo="${esc(it.id)}">${icon(c?.type, "i big")}<span class="add">${icon("camera")}Ajouter des photos</span><span>ou glisse-les ici</span></button>`}
            ${p.length > 1 ? `<button class="nav-arrow prev" data-step="-1">${icon("left")}</button><button class="nav-arrow next" data-step="1">${icon("right")}</button>` : ""}
            ${cur ? `<div class="tools">${ui.detailIdx > 0 ? `<button data-action="set-cover">${icon("star")}Couverture</button>` : ""}<button data-action="del-photo">${icon("trash")}Supprimer</button></div>` : ""}
          </div>
          <div class="thumbs">${p.map((ph, i) => `<div class="thumb ${i === ui.detailIdx ? "sel" : ""}" data-idx="${i}"><img src="${esc(photoSrc(ph))}" alt="" loading="lazy"></div>`).join("")}
            <button class="thumb add" data-add-photo="${esc(it.id)}" title="Ajouter des photos">${icon("plus")}</button></div>
        </div>
        <div class="info">
          <div class="cat">${icon(c?.type)}${esc(c?.name || "")}</div>
          <h1>${esc(it.name)}</h1>
          <div class="bm">${esc([it.brand, it.model].filter(Boolean).join(" ") || "")}</div>
          <div class="valbox"><div class="l">${it.status === "wish" ? "Prix cible" : "Valeur estimée"}</div>
            <div class="v">${valueOf(it) ? eur(valueOf(it)) : "—"} ${it.status === "owned" ? deltaPill(bp, v) : ""}</div></div>
          ${rows.length ? `<dl class="specs">${rows.map(([k, val]) => `<dt>${esc(k)}</dt><dd>${esc(val)}</dd>`).join("")}</dl>` : ""}
          ${it.notes ? `<div class="notes">${esc(it.notes)}</div>` : ""}
          <div class="acts">
            <button class="btn primary" data-action="edit-item" data-id="${esc(it.id)}">${icon("edit")}Modifier</button>
            <button class="btn danger" data-action="delete-item-detail" data-id="${esc(it.id)}">${icon("trash")}Supprimer</button>
          </div>
        </div>
      </div>`;
    $("#detailOverlay").style.setProperty("--bgimg", cur ? `url("${photoSrc(cur).replace(/["\\\n]/g, "")}")` : "none");
    if (!$("#detailOverlay").classList.contains("open")) open("#detailOverlay");
  }

  async function addPhotosToItem(id, files) {
    const it = itemById(id); if (!it) return;
    const refs = await storeFiles(files); if (!refs.length) return;
    const wasEmpty = !it.photos.length;
    it.photos.push(...refs); save(); render();
    toast(refs.length > 1 ? `${refs.length} photos ajoutées` : "Photo ajoutée");
    if (ui.detailId === id) openDetail(id, wasEmpty ? 0 : it.photos.length - refs.length);
  }

  function openCatForm(cat) {
    ui.editCat = cat ? cat.id : null;
    ui.catType = cat?.type || "home";
    const f = $("#catForm"); f.reset(); f.name.value = cat?.name || "";
    renderTypes();
    $("#catTitle").textContent = cat ? "Modifier la collection" : "Nouvelle collection";
    $("#btnDeleteCat").style.visibility = cat ? "visible" : "hidden";
    open("#catOverlay");
    f.name.focus();
  }
  function renderTypes() {
    $("#typePick").innerHTML = Object.entries(TYPES).map(([k, t]) =>
      `<button type="button" class="type ${ui.catType === k ? "active" : ""}" data-type="${k}">${icon(k)}${esc(t.label)}</button>`).join("");
  }
  function saveCat() {
    const f = $("#catForm"); const name = f.name.value.trim() || TYPES[ui.catType].label;
    if (ui.editCat) Object.assign(catById(ui.editCat), { name, type: ui.catType });
    else { const id = uid(); state.categories.push({ id, name, type: ui.catType }); ui.view = "cat:" + id; ui.tab = "owned"; }
    save(); closeAll(); render();
  }
  function deleteCat() {
    const c = catById(ui.editCat); if (!c) return;
    const items = state.items.filter(i => i.cat === c.id);
    if (!confirm(`Supprimer la collection « ${c.name} »${items.length ? ` et ses ${items.length} bien(s)` : ""} ?`)) return;
    items.forEach(i => i.photos.forEach(dropPhotoFile));
    state.categories = state.categories.filter(x => x.id !== c.id);
    state.items = state.items.filter(i => i.cat !== c.id);
    ui.view = "overview"; save(); closeAll(); render();
  }

  // ---------- Sauvegarde / import ----------
  async function exportData() {
    toast("Préparation de la sauvegarde…");
    const copy = JSON.parse(JSON.stringify(state));
    if (bridge) for (const it of copy.items) it.photos = await Promise.all(it.photos.map(p => /^(data:|https?:)/.test(p) ? p : bridge.readPhoto(p).catch(() => null))).then(a => a.filter(Boolean));
    const json = JSON.stringify({ app: "lifestyle", version: 2, exportedAt: new Date().toISOString(), ...copy });
    const name = `lifestyle-sauvegarde-${new Date().toISOString().slice(0, 10)}.json`;
    if (bridge?.exportFile) { const ok = await bridge.exportFile(name, json); if (ok) toast("Sauvegarde enregistrée"); return; }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([json], { type: "application/json" })); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  async function importData(file) {
    try {
      const s = normalize(JSON.parse(await file.text()));
      if (!s) throw new Error("format");
      if (!confirm("Remplacer toutes les données actuelles par cette sauvegarde ?")) return;
      if (bridge) {
        toast("Import des photos…");
        for (const it of s.items) it.photos = await Promise.all(it.photos.map(async p => {
          if (!p.startsWith("data:")) return p;
          const buf = new Uint8Array(await (await fetch(p)).arrayBuffer());
          return bridge.savePhoto(buf);
        }));
      }
      state = { categories: s.categories, items: s.items };
      ui.view = "overview"; save(); render(); toast("Sauvegarde restaurée");
    } catch (e) { console.error(e); toast("Fichier de sauvegarde invalide"); }
  }

  // ---------- Événements ----------
  document.addEventListener("click", async (e) => {
    const t = e.target;
    const addPhoto = t.closest("[data-add-photo]");
    if (addPhoto) { e.stopPropagation(); ui.photoTarget = addPhoto.dataset.addPhoto; $("#photoInput").click(); return; }
    const rmDraft = t.closest("[data-rm-draft]");
    if (rmDraft) { const i = +rmDraft.dataset.rmDraft; const [ref] = ui.draftPhotos.splice(i, 1); if (ui.newPhotos.includes(ref)) { dropPhotoFile(ref); ui.newPhotos = ui.newPhotos.filter(r => r !== ref); } renderFormThumbs(); return; }
    const view = t.closest("[data-view]");
    if (view) { ui.view = view.dataset.view; ui.tab = "owned"; render(); $("main").scrollTop = 0; window.scrollTo(0, 0); return; }
    const tab = t.closest("[data-tab]");
    if (tab) { ui.tab = tab.dataset.tab; renderContent(); return; }
    const type = t.closest("[data-type]");
    if (type) { ui.catType = type.dataset.type; renderTypes(); const f = $("#catForm"); if (!f.name.value.trim()) f.name.placeholder = TYPES[ui.catType].label; return; }
    const idx = t.closest("[data-idx]");
    if (idx) { openDetail(ui.detailId, +idx.dataset.idx); return; }
    const stepB = t.closest("[data-step]");
    if (stepB) { const it = itemById(ui.detailId); const n = it.photos.length; openDetail(ui.detailId, (ui.detailIdx + +stepB.dataset.step + n) % n); return; }

    const act = t.closest("[data-action]");
    if (act) {
      const a = act.dataset.action;
      if (a === "close") closeAll();
      else if (a === "add-item") openItemForm(null, act.dataset.cat || null);
      else if (a === "save-item") saveItem();
      else if (a === "delete-item") deleteItem(ui.editItem);
      else if (a === "delete-item-detail") deleteItem(act.dataset.id);
      else if (a === "edit-item") openItemForm(itemById(act.dataset.id));
      else if (a === "new-cat") openCatForm(null);
      else if (a === "edit-cat") openCatForm(catById(act.dataset.cat));
      else if (a === "save-cat") saveCat();
      else if (a === "delete-cat") deleteCat();
      else if (a === "pick-form-photos") { ui.photoTarget = "__form"; $("#photoInput").click(); }
      else if (a === "export") exportData();
      else if (a === "import") $("#importInput").click();
      else if (a === "open-data") bridge?.openDataFolder();
      else if (a === "set-cover") { const it = itemById(ui.detailId); const [ph] = it.photos.splice(ui.detailIdx, 1); it.photos.unshift(ph); save(); render(); openDetail(it.id, 0); toast("Photo de couverture mise à jour"); }
      else if (a === "del-photo") { const it = itemById(ui.detailId); if (!confirm("Supprimer cette photo ?")) return; const [ph] = it.photos.splice(ui.detailIdx, 1); dropPhotoFile(ph); save(); render(); openDetail(it.id, Math.max(0, ui.detailIdx - 1)); }
      return;
    }
    const card = t.closest("[data-open]");
    if (card) { openDetail(card.dataset.open); return; }
    if (t.classList.contains("overlay")) closeAll();
  });

  $("#itemCat").addEventListener("change", () => renderSpecFields(currentSpecs()));
  $("#photoInput").addEventListener("change", async (e) => {
    const files = [...e.target.files]; e.target.value = "";
    if (ui.photoTarget === "__form") {
      const refs = await storeFiles(files); ui.draftPhotos.push(...refs); ui.newPhotos.push(...refs); renderFormThumbs();
    } else if (ui.photoTarget) addPhotosToItem(ui.photoTarget, files);
  });
  $("#importInput").addEventListener("change", (e) => { const f = e.target.files[0]; e.target.value = ""; if (f) importData(f); });
  $("#search").addEventListener("input", (e) => { ui.q = e.target.value.trim(); renderContent(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeAll();
    if (ui.detailId && !$("#itemOverlay").classList.contains("open") && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
      const n = itemById(ui.detailId)?.photos.length || 0; if (n > 1) openDetail(ui.detailId, (ui.detailIdx + (e.key === "ArrowRight" ? 1 : -1) + n) % n);
    }
    if (e.key === "Enter" && e.target.tagName === "INPUT") {
      if (e.target.closest("#itemForm")) { e.preventDefault(); saveItem(); }
      if (e.target.closest("#catForm")) { e.preventDefault(); saveCat(); }
    }
  });

  // Glisser-déposer des photos sur une carte, la fiche ou le formulaire
  const dropTarget = (e) => e.target.closest?.("[data-drop-item], #formDrop");
  let lastOver = null;
  const clearOver = () => { lastOver?.classList.remove("drop", "over"); lastOver = null; };
  document.addEventListener("dragover", (e) => {
    if (!e.dataTransfer?.types?.includes("Files")) return;
    e.preventDefault();
    const z = dropTarget(e);
    if (z !== lastOver) { clearOver(); if (z) { z.classList.add(z.classList.contains("card") ? "drop" : "over"); lastOver = z; } }
    e.dataTransfer.dropEffect = z ? "copy" : "none";
  });
  document.addEventListener("dragleave", (e) => { if (!e.relatedTarget) clearOver(); });
  document.addEventListener("drop", async (e) => {
    e.preventDefault(); const z = dropTarget(e); clearOver();
    if (!z || !e.dataTransfer.files.length) return;
    if (z.id === "formDrop") { const refs = await storeFiles(e.dataTransfer.files); ui.draftPhotos.push(...refs); ui.newPhotos.push(...refs); renderFormThumbs(); }
    else addPhotosToItem(z.dataset.dropItem, e.dataTransfer.files);
  });

  // ---------- Démarrage ----------
  (async () => {
    state = await loadState();
    if (bridge) { $("#btnOpenData").hidden = false; save(); }
    render();
  })();
})();
</script>
</body>
</html>
